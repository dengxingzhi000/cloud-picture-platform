# ── Development profile: H2 in-memory database ─────────
# Activate with: --spring.profiles.active=dev
# Or set SPRING_PROFILES_ACTIVE=dev environment variable

spring:
  datasource:
    url: jdbc:h2:mem:cloud_picture;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  flyway:
    enabled: true
    baseline-on-migrate: false
