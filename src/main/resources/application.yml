server:
  port: 8080

spring:
  profiles:
    active: dev
  application:
    name: cloud-picture-platform
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:cloud_picture_platform}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
  data:
    redis:
      host: 192.168.0.179
      port: 6379
  cache:
    type: redis
    redis:
      cache-null-values: false
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 200MB

app:
  bootstrap:
    admin:
      enabled: false
  storage:
    provider: local
    local:
      root: data/uploads
    cos:
      secret-id: ${COS_SECRET_ID:your-secret-id-here}
      secret-key: ${COS_SECRET_KEY:your-secret-key-here}
      region: na-siliconvalley
      bucket: costorage-1320249760
      endpoint:
      base-url: http://costorage.auditoryworks.co/
      prefix:
  websocket:
    allowed-origins: ${WS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
    endpoint: /ws
  collaboration:
    provider: yjs-websocket
    room-prefix: picture
    public-url: ${COLLAB_SERVER_URL:ws://localhost:1234}
    room-token-ttl-seconds: 900
    awareness-enabled: true
    indexed-db-recommended: true
  security:
    jwt:
      issuer: cloud-picture-platform
      secret: ${JWT_SECRET:}
      access-token-ttl-seconds: 7200

  rag:
    enabled: true
    open-search:
      base-url: http://localhost:9200
      index-name: rag_chunks
      connect-timeout-ms: 5000
      socket-timeout-ms: 30000
    embedding:
      base-url: http://localhost:8000
      model: text-embedding-v3
      dimensions: 1024
      batch-size: 32
      timeout: 10s
    rerank:
      base-url: http://localhost:8000
      model: gte-rerank-v2
      top-n: 5
      enabled: true
      timeout: 10s
    generation:
      model: deepseek-reasoner
      max-tokens: 4096
      temperature: 0.3
    chunking:
      max-tokens: 512
      overlap-tokens: 50
      min-chunk-tokens: 100
    retrieval:
      bm25-top-k: 20
      vector-top-k: 20
      rrf-k: 60
      final-top-n: 5
    cache:
      embedding-ttl: 24h
      retrieval-ttl: 1h
      semantic-enabled: false
      semantic-threshold: 0.95

  ai:
    enabled: false
    gateway:
      base-url: ${AI_PLATFORM_URL:http://localhost:8000}
      timeout-ms:
        embedding: 5000
        tagging: 30000
        moderation: 15000
        chat: 60000
    tagging:
      enabled: true
      min-confidence: 0.65
      max-tags: 20
      trigger: upload
    moderation:
      enabled: true
      auto-approve-threshold: 0.92
      auto-reject-threshold: 0.95
      escalate-to-human: true
    chat:
      max-history: 20
      history-retention-days: 30

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,caches,prometheus
  health:
    redis:
      enabled: true
  metrics:
    enable:
      cache: true
