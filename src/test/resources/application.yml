# ── Test profile: H2 in-memory database ────────────────

spring:
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
  datasource:
    url: jdbc:h2:mem:cloud_picture_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  cache:
    type: simple

app:
  bootstrap:
    admin:
      enabled: false
  storage:
    provider: local
    local:
      root: data/test-uploads
  security:
    jwt:
      issuer: cloud-picture-platform-test
      secret: test-secret-key-for-testing-only-change-in-prod
      access-token-ttl-seconds: 3600
  websocket:
    endpoint: /ws
  collaboration:
    provider: yjs-websocket
    room-prefix: picture
    public-url: ws://localhost:1234
    room-token-ttl-seconds: 900
    awareness-enabled: true
    indexed-db-recommended: true
