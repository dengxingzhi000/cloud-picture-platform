# ── Test profile: H2 in-memory database ────────────────

spring:
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
  datasource:
    url: jdbc:h2:mem:cloud_picture_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  cache:
    type: simple

app:
  bootstrap:
    admin:
      enabled: false
  storage:
    provider: local
    local:
      root: data/test-uploads
  security:
    jwt:
      issuer: cloud-picture-platform-test
      secret: test-secret-key-for-testing-only-change-in-prod
      access-token-ttl-seconds: 3600
  websocket:
    endpoint: /ws
  collaboration:
    provider: yjs-websocket
    room-prefix: picture
    public-url: ws://localhost:1234
    room-token-ttl-seconds: 900
    awareness-enabled: true
    indexed-db-recommended: true
  # Mirrors app.rag from src/main/resources/application.yml. This file shadows the main
  # config on the test classpath, so every app.* section the context needs must be
  # repeated here or the corresponding @ConfigurationProperties record binds to null.
  rag:
    enabled: true
    open-search:
      base-url: http://localhost:9200
      index-name: rag_chunks
      connect-timeout-ms: 5000
      socket-timeout-ms: 30000
    embedding:
      base-url: http://localhost:8000
      model: text-embedding-v3
      dimensions: 1024
      batch-size: 32
      timeout: 10s
    rerank:
      base-url: http://localhost:8000
      model: gte-rerank-v2
      top-n: 5
      enabled: true
      timeout: 10s
    generation:
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      model: deepseek-reasoner
      max-tokens: 4096
      temperature: 0.3
    chunking:
      max-tokens: 512
      overlap-tokens: 50
      min-chunk-tokens: 100
    retrieval:
      bm25-top-k: 20
      vector-top-k: 20
      rrf-k: 60
      final-top-n: 5
    cache:
      embedding-ttl: 24h
      retrieval-ttl: 1h
      semantic-enabled: false
      semantic-threshold: 0.95
      max-entries: 10000
      ttl-ms: 86400000
    upload:
      max-file-size: 52428800
      allowed-types:
        - application/pdf
        - application/vnd.openxmlformats-officedocument.wordprocessingml.document
        - text/plain
        - text/markdown
