version: '3.9'

services:
  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: cloud_picture
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3.13-management
    ports:
      - "5672:5672"
      - "15672:15672"

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: cloud_picture
      DB_USERNAME: admin
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      REDIS_HOST: redis
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me-32chars-minimum}
      SPRING_PROFILES_ACTIVE: prod
    depends_on:
      - postgres
      - redis

  ai-platform:
    build: ./ai-platform
    ports:
      - "8000:8000"
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      REDIS_URL: redis://redis:6379
      CLIP_MODEL_NAME: ViT-L-14
    depends_on:
      - rabbitmq
      - redis
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  pgdata:
