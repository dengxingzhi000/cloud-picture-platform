name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: cloud_picture
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21 (GraalVM)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'graalvm'
          cache: maven

      - name: Grant execute permission for mvnw
        run: chmod +x ./mvnw

      - name: Compile
        run: ./mvnw compile -q

      - name: Test (H2)
        run: ./mvnw test -q
        env:
          SPRING_PROFILES_ACTIVE: dev

      - name: Integration Test (PG + Redis)
        run: |
          ./mvnw test -q -Dspring.profiles.active=test \
            -Dspring.datasource.url=jdbc:postgresql://localhost:5432/cloud_picture \
            -Dspring.datasource.username=postgres \
            -Dspring.datasource.password=postgres \
            -Dspring.data.redis.host=localhost
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: cloud_picture
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
          REDIS_HOST: localhost

      - name: Build JAR
        run: ./mvnw clean package -DskipTests